name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Decode SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d > deploy_key
          {
            echo "DEPLOY_KEY<<EOF"
            cat deploy_key
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ env.DEPLOY_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main
            npm install
            NITRO_PRESET=node-server npm run build
            cp -r .output/public/* /var/www/nuvemplanos/ 2>/dev/null || true
            pm2 restart nuvemplanos
